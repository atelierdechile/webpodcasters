{% extends "core/base.html" %}

{% block content %}
<section class="section">
  <div class="container" style="max-width: 520px; padding-top: 2rem;">
    <div class="box" style="border-radius: 16px; border: 1px solid #e1e4e8; padding: 2.5rem;">
      <h1 class="title is-4 has-text-centered" style="color: #6344ff; margin-bottom: 1rem;">
        ¿Olvidaste tu contraseña?
      </h1>
      <p class="has-text-grey has-text-centered mb-5">
        Escribe tu correo electrónico registrado y te enviaremos un enlace seguro para crear una nueva.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="field mb-5">
          <label class="label">Correo electrónico</label>
          <div class="control">
            <!-- Django renderiza el input de email aquí -->
            {{ form.email }}
          </div>
        </div>

        <!-- 🎙️ Cambiado de is-primary (verde) a is-link (morado) -->
        <button class="button is-link is-fullwidth" type="submit" style="font-weight: 600;">
          Enviar enlace de recuperación
        </button>
      </form>
    </div>
  </div>
</section>

<!-- ⚡ Parche de consistencia para el input automático de Django -->
<style>
  .box input {
    width: 100%;
    padding: calc(0.5em - 1px) calc(0.75em - 1px);
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  .box input:focus {
    outline: none;
    border-color: #6344ff;
    box-shadow: 0 0 0 0.125em rgba(99, 68, 255, 0.25);
  }
</style>
{% endblock %}
