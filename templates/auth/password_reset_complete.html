{% extends "core/base.html" %}

{% block content %}
<section class="section">
  <div class="container" style="max-width: 600px; padding-top: 2rem;">
    <div class="box has-text-centered" style="border-radius: 16px; border: 1px solid #e1e4e8; padding: 2.5rem;">
      <h1 class="title is-4" style="color: #6344ff;">Contraseña actualizada ✅</h1>
      <p class="has-text-grey">Tu configuración de seguridad ha sido guardada. Ya puedes iniciar sesión con tu nueva contraseña.</p>
      <a class="button is-link mt-4" href="{% url 'core:login' %}">
        Ir al inicio de sesión
      </a>
    </div>
  </div>
</section>
{% endblock %}
